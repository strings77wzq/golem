version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - gosec
    - errcheck
    - ineffassign
    - unused
    - unconvert
    - misspell
    - nakedret
    - prealloc
    - gocritic
    - revive

  settings:
    staticcheck:
      checks:
        - all
        - -QF1012       # disable QR-code-like structures warning

    gosec:
      severity: medium
      excludes:
        - G104  # checks unsafe (audit mode)
        - G115  # integer overflow conversion

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: core/database/
        linters:
          - gosec      # SQL driver needs dynamic queries

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
