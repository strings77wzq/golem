version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - gosec
    - ineffassign
    - unused
    - unconvert
    - misspell
    - nakedret
    - prealloc
    - revive
  disable:
    - gocritic
    - gosec
    - ineffassign
    - prealloc
    - revive

  settings:
    staticcheck:
      checks:
        - all
        - -QF1012       # disable QR-code-like structures warning

    gosec:
      severity: medium
      excludes:
        - G104  # checks unsafe (audit mode)
        - G115  # integer overflow conversion

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: core/database/
        linters:
          - gosec      # SQL driver needs dynamic queries
      - path: internal/wiring/tools\.go
        linters:
          - errcheck   # pervasive Register() calls
      - path: foundation/metrics/handler\.go
        linters:
          - errcheck   # Prometheus handler fmt.Fprintf output
      - path: cmd/golem/mcp_server\.go
        linters:
          - errcheck   # tool registration in MCP server mode
      - path: internal/gateway/openai_compat\.go
        linters:
          - errcheck   # SSE stream fmt.Fprintf

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
