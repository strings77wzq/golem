run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - gofmt
    - goimports
    - misspell
    - unconvert
  disable:
    - depguard

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    disable:
      - shadow
  goimports:
    local-prefixes: github.com/strings77wzq/golem

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
    - path: cmd/golem/
      linters:
        - unparam
    - linters:
        - errcheck
      text: "Kill"
    - linters:
        - errcheck
      text: "Write"
    - linters:
        - errcheck
      text: "Encode"
    - linters:
        - errcheck
      text: "Register"
    - linters:
        - errcheck
      text: "RegisterSQL"
    - linters:
        - errcheck
      text: "Start"
    - linters:
        - errcheck
      text: "OnError"
    - linters:
        - errcheck
      text: "Commit"
