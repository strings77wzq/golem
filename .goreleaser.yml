version: 2

builds:
  - id: golem
    main: ./cmd/golem
    binary: golem
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    format: tar.gz
    name_template: "golem_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "golem_{{.Version}}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

dockers:
  - image_templates:
      - "ghcr.io/strings77wzq/golem:{{ .Version }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    goarch: amd64

  - image_templates:
      - "ghcr.io/strings77wzq/golem:{{ .Version }}-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/strings77wzq/golem:{{ .Version }}"
    image_templates:
      - "ghcr.io/strings77wzq/golem:{{ .Version }}-amd64"
      - "ghcr.io/strings77wzq/golem:{{ .Version }}-arm64"
  - name_template: "ghcr.io/strings77wzq/golem:latest"
    image_templates:
      - "ghcr.io/strings77wzq/golem:{{ .Version }}-amd64"
      - "ghcr.io/strings77wzq/golem:{{ .Version }}-arm64"

release:
  github:
    owner: strings77wzq
    name: golem
  draft: false
  prerelease: auto
  name_template: "Golem {{.Version}}"
